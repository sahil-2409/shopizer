name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ['3.2.7']
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Git SHA of the image to deploy'
        required: true

permissions:
  actions: read

jobs:
  deploy:
    name: Deploy to Local K8s
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.event.inputs.image_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: shopizer-${{ steps.sha.outputs.sha }}
          run-id: ${{ github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker image into Colima
        run: docker load -i shopizer-image.tar

      - name: Deploy to Kubernetes
        run: |
          sed "s|shopizer:IMAGE_TAG|shopizer:${{ steps.sha.outputs.sha }}|g" k8s/shopizer.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/shopizer-app -n shopizer --timeout=120s

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:30080/swagger-ui.html > /dev/null; then
              echo "✅ App is healthy on localhost:30080"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "❌ Health check failed, rolling back"
          kubectl rollout undo deployment/shopizer-app -n shopizer
          exit 1

      - name: Cleanup old images
        run: docker image prune -f
