apiVersion: v1
kind: Namespace
metadata:
  name: shopizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopizer-app
  namespace: shopizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopizer
  template:
    metadata:
      labels:
        app: shopizer
    spec:
      containers:
        - name: shopizer
          image: shopizer:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /swagger-ui.html
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /swagger-ui.html
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shopizer-svc
  namespace: shopizer
spec:
  type: NodePort
  selector:
    app: shopizer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
